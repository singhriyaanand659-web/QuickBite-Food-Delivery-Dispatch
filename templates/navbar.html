<!-- ============================================================
     GLOBAL SHARED QUICKBITE NAVBAR (MATCHES IMAGE A EXACTLY)
============================================================ -->

<style>
/* ============================================================
   NAVBAR (IMAGE A STYLES)
============================================================ */
.qb-navbar {
    position: sticky !important;
    top: 0 !important;
    z-index: 1000 !important;
    height: 72px !important;
    background: #ffffff !important;
    border-bottom: 1px solid #f1f5f9 !important;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03) !important;
    display: flex !important;
    align-items: center !important;
    padding: 0 5% !important;
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    box-sizing: border-box !important;
    width: 100% !important;
}

.qb-logo {
    display: inline-flex !important;
    align-items: center !important;
    gap: 10px !important;
    text-decoration: none !important;
    color: #0f172a !important;
    font-size: 24px !important;
    font-weight: 900 !important;
    letter-spacing: -0.8px !important;
    flex-shrink: 0 !important;
}

.qb-logo-mark {
    width: 38px !important;
    height: 38px !important;
    background: #ff5a1f !important;
    border-radius: 12px !important;
    display: grid !important;
    place-items: center !important;
    color: #ffffff !important;
    font-size: 20px !important;
    flex-shrink: 0 !important;
    box-shadow: 0 4px 10px rgba(255, 90, 31, 0.3) !important;
}

.qb-nav {
    display: flex !important;
    align-items: center !important;
    gap: 28px !important;
    margin-left: 36px !important;
    list-style: none !important;
    padding: 0 !important;
}

.qb-nav a {
    text-decoration: none !important;
    color: #334155 !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    transition: color 0.2s ease !important;
    white-space: nowrap !important;
}

.qb-nav a:hover {
    color: #ff5a1f !important;
}

.qb-nav-right {
    margin-left: auto !important;
    display: flex !important;
    align-items: center !important;
    gap: 12px !important;
}

.location-button {
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;
    padding: 9px 14px !important;
    border: 1px solid #e2e8f0 !important;
    border-radius: 10px !important;
    background: #ffffff !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    color: #334155 !important;
    white-space: nowrap !important;
}

.nav-cart {
    display: inline-flex !important;
    align-items: center !important;
    gap: 8px !important;
    padding: 9px 16px !important;
    border-radius: 10px !important;
    background: #ff5a1f !important;
    color: #ffffff !important;
    font-size: 13px !important;
    font-weight: 800 !important;
    text-decoration: none !important;
    transition: all 0.2s ease !important;
    box-shadow: 0 4px 12px rgba(255, 90, 31, 0.25) !important;
    white-space: nowrap !important;
    border: none !important;
    cursor: pointer !important;
}

.nav-cart:hover {
    background: #e84d16 !important;
    transform: translateY(-1px) !important;
    color: #ffffff !important;
}

.nav-signin-link {
    display: inline-flex !important;
    align-items: center !important;
    gap: 6px !important;
    font-size: 14px !important;
    font-weight: 700 !important;
    color: #0f172a !important;
    text-decoration: none !important;
    padding: 8px 12px !important;
    border-radius: 10px !important;
    transition: color 0.2s ease !important;
    white-space: nowrap !important;
}

.nav-signin-link:hover {
    color: #ff5a1f !important;
}

/* User Profile Dropdown */
.user-nav-wrapper {
    position: relative !important;
}

.user-avatar-btn {
    display: inline-flex !important;
    align-items: center !important;
    gap: 8px !important;
    background: #f8fafc !important;
    border: 1.5px solid #e2e8f0 !important;
    border-radius: 12px !important;
    padding: 6px 12px !important;
    font-size: 13px !important;
    font-weight: 800 !important;
    color: #0f172a !important;
    cursor: pointer !important;
    transition: all 0.2s ease !important;
}

.user-avatar-btn:hover {
    border-color: #ff5a1f !important;
    background: #fff8f5 !important;
}

.user-dropdown-menu {
    display: none;
    position: absolute !important;
    top: calc(100% + 10px) !important;
    right: 0 !important;
    width: 220px !important;
    background: #ffffff !important;
    border-radius: 16px !important;
    border: 1px solid #e2e8f0 !important;
    box-shadow: 0 16px 36px rgba(15, 23, 42, 0.12) !important;
    padding: 8px !important;
    z-index: 1001 !important;
}

.user-dropdown-menu.show {
    display: block !important;
}

.user-dropdown-header {
    padding: 10px 12px !important;
    border-bottom: 1px solid #f1f5f9 !important;
    margin-bottom: 4px !important;
}

.user-dropdown-header strong {
    display: block !important;
    font-size: 14px !important;
    color: #0f172a !important;
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
}

.user-dropdown-header span {
    display: block !important;
    font-size: 11px !important;
    color: #64748b !important;
    white-space: nowrap !important;
    overflow: hidden !important;
    text-overflow: ellipsis !important;
}

.user-dropdown-link {
    display: flex !important;
    align-items: center !important;
    gap: 8px !important;
    padding: 9px 12px !important;
    font-size: 13px !important;
    font-weight: 700 !important;
    color: #334155 !important;
    text-decoration: none !important;
    border-radius: 8px !important;
    transition: all 0.15s ease !important;
}

.user-dropdown-link:hover {
    background: #f8fafc !important;
    color: #ff5a1f !important;
}

.user-dropdown-link.logout {
    color: #ef4444 !important;
}

.user-dropdown-link.logout:hover {
    background: #fef2f2 !important;
    color: #dc2626 !important;
}

/* Mobile Media Queries */
@media (max-width: 900px) {
    .qb-nav {
        display: none !important;
    }
}

@media (max-width: 560px) {
    .qb-navbar {
        padding: 0 4% !important;
        height: 64px !important;
    }

    .location-button {
        display: none !important;
    }

    .qb-logo {
        font-size: 20px !important;
    }

    .qb-logo-mark {
        width: 32px !important;
        height: 32px !important;
        font-size: 16px !important;
    }

    .nav-cart span,
    .nav-signin-link span:last-child {
        display: none !important;
    }

    .nav-cart {
        padding: 8px 12px !important;
    }
}
</style>

<nav class="qb-navbar">
    <a href="/" class="qb-logo">
        <div class="qb-logo-mark">⚡</div>
        QuickBite
    </a>

    <div class="qb-nav">
        <a href="/#restaurants">Restaurants</a>
        <a href="/faq">FAQ</a>
        <a href="/help">Help & Support</a>
        <a href="/#dispatch">Dispatch Engine</a>
    </div>

    <div class="qb-nav-right">
        <div class="location-button">
            📍
            <span>Dadar, Mumbai</span>
        </div>

        <a href="/orders" class="nav-cart" title="My Orders">
            📦
            <span>My Orders</span>
        </a>

        <a href="/cart" class="nav-cart" title="Cart">
            🛒
            <span>Cart</span>
        </a>

        {% if current_user %}
            <div class="user-nav-wrapper">
                <button class="user-avatar-btn" onclick="toggleUserDropdown(event)" type="button">
                    <span>{{ current_user.avatar or '👨‍💼' }}</span>
                    <span>{{ current_user.name.split(' ')[0] if current_user.name else 'Profile' }}</span>
                    <span style="font-size:10px; color:#94a3b8;">▼</span>
                </button>
                <div id="userDropdownMenu" class="user-dropdown-menu">
                    <div class="user-dropdown-header">
                        <strong>{{ current_user.name }}</strong>
                        <span>{{ current_user.email }}</span>
                    </div>
                    <a href="/profile" class="user-dropdown-link">👤 My Profile</a>
                    <a href="/orders" class="user-dropdown-link">📦 My Orders</a>
                    <a href="/cart" class="user-dropdown-link">🛒 View Cart</a>
                    <div style="height:1px; background:#f1f5f9; margin:4px 0;"></div>
                    <a href="/logout" class="user-dropdown-link logout">🚪 Log Out</a>
                </div>
            </div>
        {% else %}
            <a href="/login" class="nav-signin-link">
                <span>👤</span>
                <span>Sign In</span>
            </a>
        {% endif %}
    </div>
</nav>

<script>
function toggleUserDropdown(e) {
    if (e) {
        e.preventDefault();
        e.stopPropagation();
    }
    const menu = document.getElementById('userDropdownMenu');
    if (menu) {
        menu.classList.toggle('show');
    }
}

window.addEventListener('click', function(e) {
    const menu = document.getElementById('userDropdownMenu');
    if (menu && !e.target.closest('.user-nav-wrapper')) {
        menu.classList.remove('show');
    }
});
</script>
